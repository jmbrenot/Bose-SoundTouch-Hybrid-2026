<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fa8c9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" rx="18" fill="#0e2233"/>

  <text x="500" y="42" text-anchor="middle" fill="#f5f8fa" font-size="24" font-weight="bold">KILOVAC BATTERIE GRUISSAN</text>
  <text x="500" y="66" text-anchor="middle" fill="#7fa8c9" font-size="13">Le Shelly Plus1 pilote seul la bobine — JK-BMS non utilisé dans cette chaîne</text>

  <!-- Row 1 label -->
  <text x="50" y="108" fill="#7fa8c9" font-size="13" letter-spacing="1" font-weight="bold">PUISSANCE 48 V</text>

  <!-- Row 1: physical power chain -->
  <rect x="50" y="125" width="230" height="95" rx="12" fill="#123a5c" stroke="#3d8bd4" stroke-width="2"/>
  <text x="165" y="163" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">BATTERIE</text>
  <text x="165" y="184" text-anchor="middle" fill="#a9c6de" font-size="12">LiFePO4 48 V</text>

  <line x1="280" y1="172" x2="378" y2="172" stroke="#7fa8c9" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="385" y="125" width="230" height="95" rx="12" fill="#4a2e12" stroke="#ff9800" stroke-width="2"/>
  <text x="500" y="163" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">KILOVAC</text>
  <text x="500" y="184" text-anchor="middle" fill="#f0c896" font-size="12">Contacteur EV200AAANA</text>

  <line x1="615" y1="172" x2="713" y2="172" stroke="#7fa8c9" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="720" y="125" width="230" height="95" rx="12" fill="#12402c" stroke="#4caf50" stroke-width="2"/>
  <text x="835" y="163" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">ONDULEUR</text>
  <text x="835" y="184" text-anchor="middle" fill="#a9dcb8" font-size="12">DEYE — BAT+</text>

  <!-- Row 2 label -->
  <text x="50" y="258" fill="#7fa8c9" font-size="13" letter-spacing="1" font-weight="bold">COMMANDE 12 V</text>

  <!-- Row 2: control chain -->
  <rect x="50" y="275" width="230" height="95" rx="12" fill="#2e1f4a" stroke="#9575cd" stroke-width="2"/>
  <text x="165" y="313" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">ALIM. 12 V</text>
  <text x="165" y="334" text-anchor="middle" fill="#cbb8ea" font-size="12">via fusible</text>

  <line x1="280" y1="322" x2="378" y2="322" stroke="#7fa8c9" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="385" y="275" width="230" height="95" rx="12" fill="#123a5c" stroke="#3d8bd4" stroke-width="2"/>
  <text x="500" y="308" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">SHELLY PLUS1</text>
  <text x="500" y="328" text-anchor="middle" fill="#a9c6de" font-size="11">borne I → borne O</text>
  <circle cx="500" cy="352" r="3" fill="#0e2233" stroke="#3d8bd4" stroke-width="1.5"/>

  <line x1="615" y1="322" x2="713" y2="322" stroke="#7fa8c9" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="720" y="275" width="230" height="95" rx="12" fill="#4a2e12" stroke="#ff9800" stroke-width="2"/>
  <text x="835" y="313" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">BOBINE</text>
  <text x="835" y="334" text-anchor="middle" fill="#f0c896" font-size="12">Kilovac EV200</text>

  <!-- Authorization panel -->
  <rect x="690" y="405" width="260" height="60" rx="10" fill="#0e2233" stroke="#546e7a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="820" y="440" text-anchor="middle" fill="#a9c6de" font-size="13">Autorisation de fermeture</text>

  <text x="500" y="580" text-anchor="middle" fill="#5f7f95" font-size="12">Pas de confirmation physique automatisée — vérifier manuellement l'état réel du contacteur</text>
</svg>
