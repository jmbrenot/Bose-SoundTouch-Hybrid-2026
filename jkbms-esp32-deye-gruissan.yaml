substitutions:
  name: jkbms-esp32-deye-gruissan
  device_description: "Monitor and control the HYD6000EP JK-BMS v19 via bluetooth"
  external_components_source: github://syssi/esphome-jk-bms@main
  mac_address: A4:C1:38:08:1B:DA
  # Please use "JK02_24S" if you own a old JK-BMS < hardware version 11.0 (hardware version >= 6.0 and < 11.0)
  # Please use "JK02_32S" if you own a new JK-BMS >= hardware version 11.0 (f.e. JK-B2A8S20P hw 11.XW, sw 11.26)
  # Please use "JK04" if you have some old JK-BMS <= hardware version 3.0 (f.e. JK-B2A16S hw 3.0, sw. 3.3.0)
  protocol_version: JK02_32S

esphome:
  name: ${name}
  friendly_name: jkbms_esp32_deye_gruissan
  comment: ${device_description}
  project:
    name: "syssi.esphome-jk-bms"
    version: 3.0.0

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

# Example configuration entry
safe_mode:
  disabled: false

external_components:
  - source: ${external_components_source}
    refresh: 1d

# If you don't use Home Assistant please remove this `api` section and uncomment the `mqtt` component!
api:
  encryption:
    key: "REDACTED_NE_PAS_PARTAGER_VOIR_HA_REEL"

wifi:
  networks:
    - ssid: !secret wifi_ssid_liv
      password: !secret wifi_password_liv
    - ssid: !secret wifi_ssid_ter
      password: !secret wifi_password_ter
  min_auth_mode: WPA2
  manual_ip:
    # Set this to the IP of the ESP
    static_ip: 192.168.1.29
    # Set this to the IP address of the router. Often ends with .1
    gateway: 192.168.1.1
    # The subnet of the network. 255.255.255.0 works for most home networks.
    subnet: 255.255.255.0
    dns1: 192.168.1.1

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Jkbms-Esp32-Deye-Gruissan"
    password: "REDACTED_NE_PAS_PARTAGER_VOIR_HA_REEL"

ota:
  platform: esphome
  password: "REDACTED_NE_PAS_PARTAGER_VOIR_HA_REEL"
  on_begin:
    then:
      - switch.turn_off: ble_client_switch0
      - logger.log: "BLE connection suspended for OTA update"

logger:
  level: INFO
  logs:
    esp32_ble_tracker: INFO
    esp32_ble_client: INFO

# MQTT temporairement desactive: instabilite watchdog avec BLE + MQTT sur ce noeud Deye.
# A reactiver apres stabilisation, ou apres migration vers un firmware ESPHome/JK-BMS corrige.
# mqtt:
#  broker: !secret mqtt_host_local
#  port: 1883
#  username: !secret mqtt_username
#  password: !secret mqtt_password
#  id: mqtt_client
#  client_id: "jkbms_deye_gruissan"
#  topic_prefix: "jkbms_deye_gruissan"
#
time:
  - platform: sntp

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 100ms
    active: false

ble_client:
  - mac_address: ${mac_address}
    id: client0

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: ${protocol_version}
    throttle: 10s
    id: bms0

binary_sensor:
  - platform: jk_bms_ble
    balancing:
      name: "${name} balancing"
    charging:
      name: "${name} charging"
    discharging:
      name: "${name} discharging"
    online_status:
      name: "${name} online status"
    dry_contact_1:
      name: "${name} dry contact 1"
    dry_contact_2:
      name: "${name} dry contact 2"

button:
  - platform: jk_bms_ble
    retrieve_settings:
      name: "${name} retrieve settings"
    retrieve_device_info:
      name: "${name} retrieve device info"

number:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    balance_trigger_voltage:
      name: "${name} balance trigger voltage"
    cell_count:
      name: "${name} cell count"
    total_battery_capacity:
      name: "${name} total battery capacity"
    cell_voltage_overvoltage_protection:
      name: "${name} cell voltage overvoltage protection"
    cell_voltage_overvoltage_recovery:
      name: "${name} cell voltage overvoltage recovery"
    cell_voltage_undervoltage_protection:
      name: "${name} cell voltage undervoltage protection"
    cell_voltage_undervoltage_recovery:
      name: "${name} cell voltage undervoltage recovery"
    balancing_start_voltage:
      name: "${name} balancing start voltage"
    voltage_calibration:
      name: "${name} voltage calibration"
    current_calibration:
      name: "${name} current calibration"
    power_off_voltage:
      name: "${name} power off voltage"
    max_balance_current:
      name: "${name} max balance current"
    max_charge_current:
      name: "${name} max charge current"
    max_discharge_current:
      name: "${name} max discharge current"
    smart_sleep_voltage:
      name: "${name} smart sleep voltage"
    cell_soc100_voltage:
      name: "${name} cell soc100 voltage"
    cell_soc0_voltage:
      name: "${name} cell soc0 voltage"
    cell_request_charge_voltage:
      name: "${name} cell request charge voltage"
    cell_request_float_voltage:
      name: "${name} cell request float voltage"
    cell_request_charge_voltage_time:
      name: "${name} cell request charge voltage time"
    cell_request_float_voltage_time:
      name: "${name} cell request float voltage time"
    re_bulk_soc:
      name: "${name} re-bulk soc"
    charge_overcurrent_protection_delay:
      name: "${name} charge overcurrent protection delay"
    charge_overcurrent_protection_recovery_time:
      name: "${name} charge overcurrent protection recovery time"
    discharge_overcurrent_protection_delay:
      name: "${name} discharge overcurrent protection delay"
    discharge_overcurrent_protection_recovery_time:
      name: "${name} discharge overcurrent protection recovery time"
    short_circuit_protection_delay:
      name: "${name} short circuit protection delay"
    short_circuit_protection_recovery_time:
      name: "${name} short circuit protection recovery time"
    discharge_precharge_time:
      name: "${name} discharge precharge time"

select:
  - platform: jk_bms_ble
    dry1_trigger:
      name: "${name} dry contact 1 trigger"
    dry2_trigger:
      name: "${name} dry contact 2 trigger"

sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms0
    min_cell_voltage:
      name: "${name} min cell voltage"
      accuracy_decimals: 3
    max_cell_voltage:
      name: "${name} max cell voltage"
      accuracy_decimals: 3
    min_voltage_cell:
      name: "${name} min voltage cell"
      accuracy_decimals: 3
    max_voltage_cell:
      name: "${name} max voltage cell"
      accuracy_decimals: 3
    delta_cell_voltage:
      name: "${name} delta cell voltage"
      accuracy_decimals: 3
    average_cell_voltage:
      name: "${name} average cell voltage"
      accuracy_decimals: 3
    cell_voltage_1:
      name: "${name} cell voltage 1"
      accuracy_decimals: 3
    cell_voltage_2:
      name: "${name} cell voltage 2"
      accuracy_decimals: 3
    cell_voltage_3:
      name: "${name} cell voltage 3"
      accuracy_decimals: 3
    cell_voltage_4:
      name: "${name} cell voltage 4"
      accuracy_decimals: 3
    cell_voltage_5:
      name: "${name} cell voltage 5"
      accuracy_decimals: 3
    cell_voltage_6:
      name: "${name} cell voltage 6"
      accuracy_decimals: 3
    cell_voltage_7:
      name: "${name} cell voltage 7"
      accuracy_decimals: 3
    cell_voltage_8:
      name: "${name} cell voltage 8"
      accuracy_decimals: 3
    cell_voltage_9:
      name: "${name} cell voltage 9"
      accuracy_decimals: 3
    cell_voltage_10:
      name: "${name} cell voltage 10"
      accuracy_decimals: 3
    cell_voltage_11:
      name: "${name} cell voltage 11"
      accuracy_decimals: 3
    cell_voltage_12:
      name: "${name} cell voltage 12"
      accuracy_decimals: 3
    cell_voltage_13:
      name: "${name} cell voltage 13"
      accuracy_decimals: 3
    cell_voltage_14:
      name: "${name} cell voltage 14"
      accuracy_decimals: 3
    cell_voltage_15:
      name: "${name} cell voltage 15"
      accuracy_decimals: 3
    cell_voltage_16:
      name: "${name} cell voltage 16"
      accuracy_decimals: 3
    total_voltage:
      name: "${name} total voltage"
      filters:
        - delta: 0.1
    current:
      name: "${name} current"
      filters:
        - delta: 0.01
    power:
      name: "${name} power"
      filters:
        - delta: 0.1
    charging_power:
      name: "${name} charging power"
      id: bms0_charging_power
      filters:
        - delta: 0.1
    discharging_power:
      name: "${name} discharging power"
      id: bms0_discharging_power
      filters:
        - delta: 0.1
    balancer_status_bitmask:
      name: "${name} balancer status bitmask"
    state_of_charge:
      name: "${name} state of charge"
      filters:
        - delta: 0.1
    state_of_health:
      name: "${name} state of health"
    capacity_remaining:
      name: "${name} capacity remaining"
      filters:
        - delta: 0.1
    full_charge_capacity:
      name: "${name} full charge capacity"
    charging_cycles:
      name: "${name} charging cycles"
    total_charging_cycle_capacity:
      name: "${name} total charging cycle capacity"
      filters:
        - delta: 0.1
    total_runtime:
      name: "${name} total runtime"
      filters:
        - delta: 0.1
    balancing_current:
      name: "${name} balancing current"
      filters:
        - delta: 0.01
    emergency_time_countdown:
      name: "${name} emergency time countdown"
    charge_status_id:
      name: "${name} charge status id"
    charge_status_time_elapsed:
      name: "${name} charge status time elapsed"
    detail_log_entry_count:
      name: "${name} detail log entry count"
    battery_type_id:
      name: "${name} battery type id"

  - platform: total_daily_energy
    name: "${name} charging energy today"
    icon: mdi:counter
    power_id: bms0_charging_power
    accuracy_decimals: 3
    unit_of_measurement: kWh
    restore: true
    filters:
      - multiply: 0.001

  - platform: total_daily_energy
    name: "${name} discharging energy today"
    icon: mdi:counter
    power_id: bms0_discharging_power
    accuracy_decimals: 3
    unit_of_measurement: kWh
    restore: true
    filters:
      - multiply: 0.001

switch:
  - platform: jk_bms_ble
    charging:
      name: "${name} charging"
    discharging:
      name: "${name} discharging"
    balancer:
      name: "${name} balancer"
    emergency:
      name: "${name} emergency"
    display_always_on:
      name: "${name} display always on"
    smart_sleep:
      name: "${name} smart sleep"
    disable_pcl_module:
      name: "${name} disable pcl module"
    timed_stored_data:
      name: "${name} timed stored data"
    charging_float_mode:
      name: "${name} charging float mode"

  - platform: ble_client
    ble_client_id: client0
    id: ble_client_switch0
    name: "${name} enable bluetooth connection"

text_sensor:
  - platform: jk_bms_ble
    errors:
      name: "${name} errors"
    errors_bitmask_hex:
      name: "${name} errors bitmask hex"
    balancer_status:
      name: "${name} balancer status"
    total_runtime_formatted:
      name: "${name} total runtime formatted"
    charge_status:
      name: "${name} charge status"
    software_version:
      name: "${name} software version"
    hardware_version:
      name: "${name} hardware version"
    battery_type:
      name: "${name} battery type"

captive_portal:

web_server:
  port: 80

http_request:
  timeout: 5s
  verify_ssl: false
