solax_modbus_update_hacs_then_merge:
  alias: SolaX Modbus - update HACS puis merge local
  icon: mdi:source-merge
  mode: single
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: update.solax_inverter_modbus_update
              state: "on"
          sequence:
            - service: persistent_notification.create
              data:
                title: Mise a jour SolaX Modbus
                message: >
                  Nouvelle version detectee. Version installee :
                  {{ state_attr('update.solax_inverter_modbus_update', 'installed_version') | default('inconnue', true) }}.
                  Derniere version :
                  {{ state_attr('update.solax_inverter_modbus_update', 'latest_version') | default('inconnue', true) }}.
                  Demarrage de la mise a jour HACS, puis merge local Gruissan.
            - service: update.install
              target:
                entity_id: update.solax_inverter_modbus_update
              continue_on_error: true
            - delay: "00:02:00"
            - service: shell_command.solax_modbus_merge_latest
            - service: persistent_notification.create
              data:
                title: Merge SolaX Modbus lance
                message: >
                  Le merge local est lance en arriere-plan. Suivre
                  /config/backup_toolkit/solax_update_merge.log ou
                  /config/backup_toolkit/solax_update_merge_status.json,
                  puis redemarrer Home Assistant quand le statut indique success=true.
      default:
        - service: persistent_notification.create
          data:
            title: Mise a jour SolaX Modbus ignoree
            message: >
              Aucune nouvelle version HACS n'est disponible pour
              SolaX Modbus. Etat update :
              {{ states('update.solax_inverter_modbus_update') }}.
              Version installee :
              {{ state_attr('update.solax_inverter_modbus_update', 'installed_version') | default('inconnue', true) }}.
              Derniere version :
              {{ state_attr('update.solax_inverter_modbus_update', 'latest_version') | default('inconnue', true) }}.
              Le merge local n'a pas ete lance.


sauvegarde_complete_demarrer_dashboard:
  alias: Sauvegarde complete Gruissan - demarrer
  icon: mdi:database-arrow-up
  mode: single
  sequence:
    - action: shell_command.sauvegarde_complete_demarrer_dashboard
    - delay: "00:00:02"
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.sauvegarde_complete_ha_gruissan

sauvegarde_complete_interrompre_dashboard:
  alias: Sauvegarde complete Gruissan - interrompre
  icon: mdi:stop-circle-outline
  mode: single
  sequence:
    - action: shell_command.sauvegarde_complete_interrompre_dashboard
    - delay: "00:00:02"
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.sauvegarde_complete_ha_gruissan


# CODEX KILOVAC BATTERIE GRUISSAN - DEBUT
kilovac_batterie_gruissan_autoriser_fermeture:
  alias: Kilovac batterie Gruissan - armer la fermeture
  icon: mdi:lock-open-check
  mode: single
  sequence:
    - action: input_boolean.turn_on
      target: {entity_id: input_boolean.kilovac_batterie_gruissan_autorisation}

kilovac_batterie_gruissan_interdire_fermeture:
  alias: Kilovac batterie Gruissan - ouvrir et désarmer
  icon: mdi:lock
  mode: restart
  sequence:
    - action: input_boolean.turn_off
      target: {entity_id: input_boolean.kilovac_batterie_gruissan_autorisation}
    - action: script.kilovac_batterie_gruissan_ouvrir

kilovac_batterie_gruissan_ouvrir:
  alias: Kilovac batterie Gruissan - ouvrir
  icon: mdi:electric-switch
  mode: restart
  sequence:
    - action: switch.turn_off
      target: {entity_id: switch.garage_shellyplus1_kilovac}
    - action: persistent_notification.create
      data:
        title: Kilovac batterie Gruissan
        message: >-
          Commande d'ouverture envoyée au Shelly. Aucune confirmation
          automatique disponible : vérifier physiquement l'état du
          contacteur.

kilovac_batterie_gruissan_fermer:
  alias: Kilovac batterie Gruissan - fermer
  icon: mdi:electric-switch-closed
  mode: single
  sequence:
    - condition: state
      entity_id: input_boolean.kilovac_batterie_gruissan_autorisation
      state: "on"
    - condition: template
      value_template: "{{ states('switch.garage_shellyplus1_kilovac') not in ['unknown', 'unavailable'] }}"
    - action: switch.turn_on
      target: {entity_id: switch.garage_shellyplus1_kilovac}
    - action: persistent_notification.create
      data:
        title: Kilovac batterie Gruissan
        message: >-
          Commande de fermeture envoyée au Shelly. Aucune confirmation
          automatique disponible : vérifier physiquement l'état du
          contacteur avant de considérer la fermeture effective.

kilovac_batterie_gruissan_etat:
  alias: Kilovac batterie Gruissan - afficher état
  icon: mdi:information-outline
  mode: single
  sequence:
    - action: persistent_notification.create
      data:
        title: Kilovac batterie Gruissan - état
        message: >
          Autorisation {{ states('input_boolean.kilovac_batterie_gruissan_autorisation') }},
          Shelly {{ states('switch.garage_shellyplus1_kilovac') }}.
          Aucune confirmation physique automatisée : vérifier au multimètre si besoin.
# CODEX KILOVAC BATTERIE GRUISSAN - FIN
