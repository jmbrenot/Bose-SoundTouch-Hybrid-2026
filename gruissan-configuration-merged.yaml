    sensor:
      - name: "Production Solaire Pic Instantane"
        unique_id: production_solaire_pic_instantane
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >-
          {% set current_kw = states('sensor.puissance_totale_micro_onduleurs') | float(0) / 1000 %}
          {% set previous_kw = this.state | float(0) %}
          {% if trigger.platform == 'time' %}
            0
          {% elif current_kw > previous_kw %}
            {{ current_kw | round(2) }}
          {% else %}
            {{ previous_kw | round(2) }}
          {% endif %}
        attributes:
          heure: >-
            {% set current_kw = states('sensor.puissance_totale_micro_onduleurs') | float(0) / 1000 %}
            {% set previous_kw = this.state | float(0) %}
            {% if trigger.platform == 'time' %}
              --:--
            {% elif current_kw > previous_kw %}
              {{ now().strftime('%H:%M') }}
            {% else %}
              {{ this.attributes.heure | default('--:--') }}
            {% endif %}
          pic_hier: >-
            {% if trigger.platform == 'time' %}
              {{ this.state | float(0) | round(2) }}
            {% else %}
              {{ this.attributes.pic_hier | default(0) }}
            {% endif %}
          pic_avant_hier: >-
            {% if trigger.platform == 'time' %}
              {{ this.attributes.pic_hier | default(0) }}
            {% else %}
              {{ this.attributes.pic_avant_hier | default(0) }}
            {% endif %}
          ecart_hier: >-
            {% set current_kw = states('sensor.puissance_totale_micro_onduleurs') | float(0) / 1000 %}
            {% set today_peak = [current_kw, this.state | float(0)] | max %}
            {% set yesterday_peak = this.attributes.pic_hier | default(0) | float(0) %}
            {% if yesterday_peak > 0 %}
              {{ (((today_peak - yesterday_peak) / yesterday_peak) * 100) | round(1) }}
            {% else %}
              0
            {% endif %}
