# automation: automations.yaml
# default_config: null
# frontend:
#   themes: themes
# scene: scenes.yaml
# script: scripts.yaml

# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Text to speech
# tts:
#   - platform: google_translate

# group: !include groups.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
mqtt: !include mqtt.yaml

shell_command:
  sauvegarde_complete_demarrer_dashboard: "sh /config/backups/codex-ha-config/ha-backup-start.sh"
  sauvegarde_complete_interrompre_dashboard: "sh /config/backups/codex-ha-config/ha-backup-stop.sh"
  solax_modbus_merge_latest: "sh -c 'python3 /config/backup_toolkit/update_solax_modbus_merged.py --target latest --force >> /config/backup_toolkit/solax_update_merge.log 2>&1 &'"

logger:
  default: info
recorder:
  db_url: !secret recorder_db_url
  purge_keep_days: 14
  auto_purge: true
  exclude:
    domains:
      - camera
      - media_player
      - update
    entity_globs:
      - sensor.jkbms_esp32_*_cell_voltage*
      - sensor.jkbms_esp32_*_voltage_cell*
      - sensor.*_firmware*
      - sensor.*_software_version*
      - sensor.*_hardware_version*
      - sensor.*_rtc
      - sensor.*_rssi
      - sensor.*_uptime
      - sensor.*_bssid
      - sensor.*_ssid
      - sensor.*_sim_1
      - sensor.*_audio_output
      - sensor.*_last_update_trigger
      - sensor.*_app_version
      - sensor.*_location_permission
      - sensor.*_geocoded_location
      - sensor.*_storage
      - binary_sensor.*_image_too_dark
      - binary_sensor.*_image_too_blurry
      - binary_sensor.*_motion_region_detection

http:
   use_x_forwarded_for: true
   trusted_proxies:
       - 10.0.0.0/24
       - 172.16.0.0/24
       - 192.168.0.0/24
       - 172.30.33.0/24
       - 192.168.1.0/24

modbus:
  - name: hoymiles
    type: serial
    method: rtu
    port: /dev/serial/by-id/usb-1a86_USB2.0-Ser_-if00-port0
    baudrate: 9600
    stopbits: 1
    bytesize: 8
    parity: N
    delay: 2
    timeout: 5

    sensors:

      # =====================================
      # MICRO-ONDULEUR 1
      # =====================================

      - name: "Micro-onduleur 1 Puissance"
        slave: 101
        address: 4112
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

      - name: "Micro-onduleur 1 Tension PV"
        slave: 101
        address: 4104
        input_type: holding
        data_type: uint16
        unit_of_measurement: "V"

      - name: "Micro-onduleur 1 Temperature"
        slave: 101
        address: 4120
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"

      # =====================================
      # MICRO-ONDULEUR 2
