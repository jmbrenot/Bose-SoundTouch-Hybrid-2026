template:
  - sensor:

      - name: "JKBMS Gruissan Cellule Tension Max"
        unique_id: jkbms_gruissan_cellule_tension_max
        icon: mdi:numeric
        state: >
          {{ states('sensor.jkbms_esp32_gruissan_jkbms_esp32_gruissan_max_voltage_cell') | float(0) | round(0) | int }}

      - name: "JKBMS Gruissan Cellule Tension Min"
        unique_id: jkbms_gruissan_cellule_tension_min
        icon: mdi:numeric
        state: >
          {{ states('sensor.jkbms_esp32_gruissan_jkbms_esp32_gruissan_min_voltage_cell') | float(0) | round(0) | int }}  

      - name: "JKBMS HYD6000EP Capacite Affichage"
        unique_id: jkbms_hyd6000ep_capacite_affichage
        unit_of_measurement: "Ah"
        icon: mdi:battery-high
        state: >
          {{ states('number.jkbms_esp32_hyd6000ep_jkbms_esp32_hyd6000ep_total_battery_capacity') | float(0) | round(0) }}
      # =====================================
      # PRODUCTION SOLAIRE TOTALE
      # =====================================

      - name: "Production Solaire Totale"
        unique_id: production_solaire_totale
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

        state: >
          {{
            states('sensor.micro_onduleur_1_puissance')|float(0)
            + states('sensor.micro_onduleur_2_puissance')|float(0)
            + states('sensor.micro_onduleur_3_puissance')|float(0)
            + states('sensor.micro_onduleur_4_puissance')|float(0)
            + states('sensor.micro_onduleur_5_puissance')|float(0)
            + states('sensor.micro_onduleur_6_puissance')|float(0)
            + states('sensor.micro_onduleur_7_puissance')|float(0)
            + states('sensor.micro_onduleur_8_puissance')|float(0)
            + states('sensor.micro_onduleur_9_puissance')|float(0)
          }}

