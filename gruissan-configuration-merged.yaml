      # =====================================
      # MICRO-ONDULEUR 8
      # =====================================

      - name: "Micro-onduleur 8 Puissance"
        slave: 101
        address: 4392
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

      - name: "Micro-onduleur 8 Tension PV"
        slave: 101
        address: 4384
        input_type: holding
        data_type: uint16
        unit_of_measurement: "V"

      - name: "Micro-onduleur 8 Temperature"
        slave: 101
        address: 4400
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"

      # =====================================
      # MICRO-ONDULEUR 9
      # =====================================

      - name: "Micro-onduleur 9 Puissance"
        slave: 101
        address: 4432
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

      - name: "Micro-onduleur 9 Tension PV"
        slave: 101
        address: 4424
        input_type: holding
        data_type: uint16
        unit_of_measurement: "V"

      - name: "Micro-onduleur 9 Temperature"
        slave: 101
        address: 4440
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "°C"

  # =====================================
  # DEYE SUN-6K-SG05LP1-EU-AM2-P (Modbus TCP natif, remplace comdif/ha-solarmodbus)
  # Registres valides sur materiel reel identique (VMrenato/homeassistant-deye-tcan485-esphome,
  # SUN-6K-SG05LP1-EU-AM2-P, cf docs/registers.md) - corrige deux erreurs de deye_hybrid.yaml
  # (Total Grid Import/Export sont des registres simples, pas des paires 32 bits) et confirme
  # l'ordre mot faible d'abord pour les compteurs 32 bits (swap: word).
  # message_wait_milliseconds ajoute un espacement entre requetes Modbus : le bus RS485 a
  # 9600 bauds via la passerelle est trop lent pour des requetes individuelles trop rapprochees,
  # cause probable des valeurs precedemment aberrantes (cf deye-modbus-gruissan-runbook.md).
  # =====================================
  - name: deye
    type: tcp
    host: 192.168.1.170
    port: 502
    delay: 2
    timeout: 5
    message_wait_milliseconds: 100

    sensors:

      # =====================================
      # SOLAIRE
      # =====================================

      - name: "DEYE PV1 Puissance"
        slave: 4
        address: 186
        input_type: holding
        data_type: uint16
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

      - name: "DEYE PV2 Puissance"
        slave: 4
        address: 187
        input_type: holding
        data_type: uint16
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

      - name: "DEYE PV1 Tension"
        slave: 4
        address: 109
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "V"
        device_class: voltage

      - name: "DEYE PV2 Tension"
        slave: 4
        address: 111
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "V"
        device_class: voltage

      - name: "DEYE Production Jour"
        slave: 4
        address: 108
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing

      - name: "DEYE Production Totale"
        slave: 4
        address: 96
        input_type: holding
        data_type: uint32
        swap: word
        scale: 0.1
        precision: 1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing

      # =====================================
      # BATTERIE
      # =====================================

      - name: "DEYE Batterie SOC"
        slave: 4
        address: 184
        input_type: holding
        data_type: uint16
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement

      - name: "DEYE Batterie Tension"
        slave: 4
        address: 183
        input_type: holding
        data_type: uint16
        scale: 0.01
        precision: 2
        unit_of_measurement: "V"
        device_class: voltage

      - name: "DEYE Batterie Courant"
        slave: 4
        address: 191
        input_type: holding
        data_type: int16
        scale: 0.01
        precision: 2
        unit_of_measurement: "A"
        device_class: current

      - name: "DEYE Batterie Puissance"
        slave: 4
        address: 190
        input_type: holding
        data_type: int16
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

      - name: "DEYE Batterie Temperature"
        slave: 4
        address: 182
        input_type: holding
        data_type: uint16
        scale: 0.1
        offset: -100
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature

      - name: "DEYE Batterie Charge Jour"
        slave: 4
        address: 70
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing

      - name: "DEYE Batterie Decharge Jour"
        slave: 4
        address: 71
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing

      - name: "DEYE Batterie Charge Totale"
        slave: 4
        address: 72
        input_type: holding
        data_type: uint32
        swap: word
        scale: 0.1
        precision: 1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing

      - name: "DEYE Batterie Decharge Totale"
        slave: 4
        address: 74
        input_type: holding
        data_type: uint32
        swap: word
        scale: 0.1
        precision: 1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing

      # =====================================
      # RESEAU
      # =====================================

      - name: "DEYE Reseau Puissance"
        slave: 4
        address: 169
        input_type: holding
        data_type: int16
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

      - name: "DEYE Reseau Puissance CT"
        slave: 4
        address: 172
        input_type: holding
        data_type: int16
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

      - name: "DEYE Reseau Tension L1"
        slave: 4
        address: 150
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "V"
        device_class: voltage

      - name: "DEYE Frequence Reseau"
        slave: 4
        address: 79
        input_type: holding
        data_type: uint16
        scale: 0.01
        precision: 2
        unit_of_measurement: "Hz"
        device_class: frequency

      - name: "DEYE Energie Achetee Jour"
        slave: 4
        address: 76
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing

      - name: "DEYE Energie Vendue Jour"
        slave: 4
        address: 77
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing

      # Registre simple (pas 32 bits) - deye_hybrid.yaml le combinait a tort avec le registre 79
      - name: "DEYE Energie Achetee Totale"
        slave: 4
        address: 78
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing

      # Registre simple (pas 32 bits) - deye_hybrid.yaml le combinait a tort avec le registre 82
      - name: "DEYE Energie Vendue Totale"
        slave: 4
        address: 81
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing

      # =====================================
      # CHARGE / ONDULEUR
      # =====================================

      - name: "DEYE Charge Puissance"
        slave: 4
        address: 178
        input_type: holding
        data_type: uint16
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

      - name: "DEYE Charge Conso Jour"
        slave: 4
        address: 84
        input_type: holding
        data_type: uint16
        scale: 0.1
        precision: 1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing

      - name: "DEYE Charge Conso Totale"
        slave: 4
        address: 85
        input_type: holding
        data_type: uint32
        swap: word
        scale: 0.1
        precision: 1
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing

      - name: "DEYE Onduleur Puissance"
        slave: 4
        address: 175
        input_type: holding
        data_type: int16
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement

      - name: "DEYE Onduleur Temperature DC"
        slave: 4
        address: 90
        input_type: holding
        data_type: uint16
        scale: 0.1
        offset: -100
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature

      - name: "DEYE Onduleur Temperature AC"
        slave: 4
        address: 91
        input_type: holding
        data_type: uint16
        scale: 0.1
        offset: -100
        precision: 1
        unit_of_measurement: "°C"
        device_class: temperature

    binary_sensors:

      - name: "DEYE Reseau Connecte"
        slave: 4
        address: 194
        input_type: holding
        device_class: connectivity

sensor:

  #################################################################
  # ENERGIE TOTALE CENTRALE
  #################################################################

  - platform: statistics
    name: "JKBMS Growatt Gruissan tension min 24h"
    entity_id: sensor.jkbms_esp32_gruissan_jkbms_esp32_gruissan_min_cell_voltage_2
    state_characteristic: value_min
    max_age:
      hours: 24
    sampling_size: 10000
  
  - platform: statistics
    name: "JKBMS Growatt Auzeville tension min 24h"
    entity_id: sensor.jkbms_esp32_hyd6000ep_jkbms_esp32_hyd6000ep_min_cell_voltage
    state_characteristic: value_min
    max_age:
      hours: 24
    sampling_size: 10000
  
  - platform: statistics
    name: "JKBMS SOFAR Auzeville tension min 24h"
    entity_id: sensor.jkbms_esp32_sofar_jkbms_esp32_sofar_min_cell_voltage
    state_characteristic: value_min
    max_age:
      hours: 24
    sampling_size: 10000
  
  - platform: statistics
    name: "JKBMS HYD6000EP tension min 24h"
    entity_id: sensor.jkbms_esp32_auzeville_jkbms_esp32_auzeville_min_cell_voltage
    state_characteristic: value_min
    max_age:
      hours: 24
    sampling_size: 10000
  - platform: integration
    source: sensor.production_solaire_totale
    name: hoymiles_energie_totale_calculee
    unit_prefix: k
    unit_time: h
    round: 2
    method: left

  #################################################################
  # MICRO-ONDULEURS
  #################################################################

  - platform: integration
    source: sensor.micro_onduleur_1_puissance
    name: micro_1_energie_totale
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    source: sensor.micro_onduleur_2_puissance
    name: micro_2_energie_totale
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    source: sensor.micro_onduleur_3_puissance
    name: micro_3_energie_totale
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    source: sensor.micro_onduleur_4_puissance
    name: micro_4_energie_totale
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    source: sensor.micro_onduleur_5_puissance
    name: micro_5_energie_totale
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    source: sensor.micro_onduleur_6_puissance
    name: micro_6_energie_totale
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    source: sensor.micro_onduleur_7_puissance
    name: micro_7_energie_totale
    unit_prefix: k
    unit_time: h
    round: 3
    method: left

  - platform: integration
    source: sensor.micro_onduleur_8_puissance
    name: micro_8_energie_totale
    unit_prefix: k
    unit_time: h
    round: 3
