          {% if age < 1.84566 or age >= 27.68493 %}
            new_moon
          {% elif age < 5.53699 %}
            waxing_crescent
          {% elif age < 9.22831 %}
            first_quarter
          {% elif age < 12.91963 %}
            waxing_gibbous
          {% elif age < 16.61096 %}
            full_moon
          {% elif age < 20.30228 %}
